    <!-- Schema.org — datos estructurados para Google -->

        "name": "Argentina"

      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Servicios de transformación organizacional",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Diagnóstico organizacional" } },
